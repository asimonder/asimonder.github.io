<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Harbor Resonance</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        #info-bar {
            font-size: 1.25rem;
            font-weight: bold;
            color: #8ab4f8;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .controls {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            background: #1e1e1e;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        span.val {
            color: #ffffff;
            font-weight: bold;
        }
        input[type=range] {
            cursor: pointer;
        }
        canvas {
            background-color: #1a1a1a;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="info-bar">Wave Speed: 0.00 m/s | Resonant Period: 0.00 s</div>

    <div class="controls">
        <div class="control-group">
            <label>Length L (<span class="val" id="l-val">2800</span> m)</label>
            <input type="range" id="len" min="500" max="3000" step="100" value="2800">
        </div>
        <div class="control-group">
            <label>Depth h (<span class="val" id="h-val">23</span> m)</label>
            <input type="range" id="dep" min="10" max="50" step="1" value="23">
        </div>
        <div class="control-group">
            <label>Mode n (<span class="val" id="n-val">3</span>)</label>
            <input type="range" id="mod" min="1" max="10" step="1" value="3">
        </div>
        <div class="control-group">
            <label>Anim Speed (<span class="val" id="s-val">50</span>)</label>
            <input type="range" id="spd" min="1" max="100" step="1" value="50">
        </div>
    </div>

    <canvas id="simCanvas" width="900" height="500"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const inputs = {
            L: document.getElementById('len'),
            h: document.getElementById('dep'),
            n: document.getElementById('mod'),
            speed: document.getElementById('spd')
        };

        const displays = {
            L: document.getElementById('l-val'),
            h: document.getElementById('h-val'),
            n: document.getElementById('n-val'),
            speed: document.getElementById('s-val')
        };

        const infoBar = document.getElementById('info-bar');
        
        let time = 0;
        const g = 9.81;
        const maxL = 3000;
        const maxH = 50;

        function animate() {
            // Get current values
            const L = parseFloat(inputs.L.value);
            const h = parseFloat(inputs.h.value);
            const n = parseInt(inputs.n.value);
            const animSpeed = parseInt(inputs.speed.value);

            // Update UI labels
            displays.L.textContent = L;
            displays.h.textContent = h;
            displays.n.textContent = n;
            displays.speed.textContent = animSpeed;

            // Physics Calculations
            const c = Math.sqrt(g * h);
            const k = ((2 * n - 1) * Math.PI) / (2 * L);
            const w = k * c;
            const T = (2 * Math.PI) / w;

            infoBar.textContent = `Wave Speed: ${c.toFixed(2)} m/s | Resonant Period: ${T.toFixed(2)} s`;

            // Advance time
            time += animSpeed * 0.05;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Setup dynamic visual scaling
            const marginX = 80;
            const centerY = canvas.height / 2;
            
            // Scale drawing width and depth based on max allowed inputs
            const availableWidth = canvas.width - (marginX * 2);
            const drawWidth = (L / maxL) * availableWidth;
            
            const maxDrawDepth = 180; 
            const drawDepth = (h / maxH) * maxDrawDepth;

            // Draw water body
            ctx.beginPath();
            ctx.moveTo(marginX, centerY + drawDepth); // Start at bottom left
            
            // Calculate surface points
            for (let px = 0; px <= drawWidth; px++) {
                const physicalX = (px / drawWidth) * L;
                // Elevation y = 30 * cos(kx) * cos(wt)
                const y = 30 * Math.cos(k * physicalX) * Math.cos(w * time);
                ctx.lineTo(marginX + px, centerY - y);
            }
            
            ctx.lineTo(marginX + drawWidth, centerY + drawDepth); // Drop to bottom right
            ctx.closePath();

            // Fill water color
            ctx.fillStyle = 'rgba(100, 150, 255, 0.4)';
            ctx.fill();

            // Stroke the animated surface line
            ctx.beginPath();
            for (let px = 0; px <= drawWidth; px++) {
                const physicalX = (px / drawWidth) * L;
                const y = 30 * Math.cos(k * physicalX) * Math.cos(w * time);
                if (px === 0) ctx.moveTo(marginX + px, centerY - y);
                else ctx.lineTo(marginX + px, centerY - y);
            }
            ctx.strokeStyle = '#8ab4f8';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw solid wall and sea floor
            ctx.beginPath();
            ctx.moveTo(marginX, centerY - 100); // Wall top
            ctx.lineTo(marginX, centerY + drawDepth); // Wall bottom
            ctx.lineTo(marginX + drawWidth, centerY + drawDepth); // Floor
            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Loop
            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
